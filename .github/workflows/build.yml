name: build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar los reportes de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
