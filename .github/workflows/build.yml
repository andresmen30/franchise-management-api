name: build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: compilar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar los reportes de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  imagen:
    name: construir y arrancar la imagen
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen para la arquitectura de despliegue
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: franchise-management-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que la imagen arranca y alcanza la base de datos
        run: |
          docker network create ci-net
          docker run -d --name dynamodb --network ci-net \
            amazon/dynamodb-local:3.3.1 -jar DynamoDBLocal.jar -sharedDb -inMemory
          docker run -d --name app --network ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=local \
            -e DYNAMODB_ENDPOINT=http://dynamodb:8000 \
            franchise-management-api:ci
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "la aplicacion respondio readiness UP"
              exit 0
            fi
            sleep 3
          done
          echo "la imagen no alcanzo el estado readiness"
          docker logs app
          exit 1

      - name: Recoger logs si algo fallo
        if: failure()
        run: docker logs app || true
