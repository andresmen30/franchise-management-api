spring:
  application:
    name: franchise-management-api

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  dynamodb:
    table-name: ${DYNAMODB_TABLE_NAME:franchises}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${DYNAMODB_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState, dynamoDb

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    co.com.nequi.franchise: INFO
